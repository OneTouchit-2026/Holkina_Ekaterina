<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прайс-лист | Rado max trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfbfb;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-hover: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #f472b6;
            --accent-glow: rgba(244, 114, 182, 0.3);
            --border-radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: float 15s infinite ease-in-out alternate;
        }

        .shape-1 { width: 400px; height: 400px; background: rgba(251, 194, 235, 0.5); top: -5%; left: -10%; }
        .shape-2 { width: 500px; height: 500px; background: rgba(166, 193, 238, 0.4); bottom: -10%; right: -10%; animation-delay: -5s; animation-duration: 20s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.05); }
        }

        /* Top bar */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(253, 251, 251, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.8);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.04);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 9px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .back-btn:hover {
            background: #fdf2f8;
            color: var(--accent-color);
            border-color: var(--accent-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.15);
        }

        .back-btn svg {
            width: 16px; height: 16px;
            flex-shrink: 0;
        }

        .top-title {
            font-size: 1rem;
            font-weight: 700;
            color: #334155;
            flex: 1;
        }

        .top-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Search */
        .search-wrap {
            padding: 16px 20px 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 18px 12px 44px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .search-input::placeholder { color: var(--text-secondary); }

        .search-input:focus {
            background: white;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.12);
        }

        .search-wrap-inner {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        /* Table container */
        .table-wrap {
            padding: 0 12px 40px;
            max-width: 960px;
            margin: 0 auto;
        }

        .table-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: rgba(244, 114, 182, 0.08);
        }

        thead th {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            white-space: nowrap;
        }

        thead th:last-child {
            text-align: right;
        }

        thead th:nth-child(3) {
            text-align: center;
        }

        /* Category rows */
        tr.cat-main td {
            padding: 14px 16px 6px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            background: rgba(244, 114, 182, 0.05);
            border-top: 1px solid rgba(244, 114, 182, 0.12);
        }

        tr.cat-sub td {
            padding: 10px 16px 5px 28px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        /* Product rows */
        tr.product-row td {
            padding: 11px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(0,0,0,0.04);
            vertical-align: middle;
            color: var(--text-primary);
        }

        tr.product-row:last-child td {
            border-bottom: none;
        }

        tr.product-row:hover td {
            background: rgba(244, 114, 182, 0.04);
        }

        td.col-name {
            line-height: 1.4;
        }

        td.col-barcode {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        td.col-qty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        td.col-price {
            text-align: right;
            font-weight: 700;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .price-val {
            background: rgba(244, 114, 182, 0.08);
            color: #db2777;
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        /* Empty state */
        .no-results {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: none;
        }

        .no-results span {
            display: block;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        /* Stats badge */
        .stats {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 0 20px 10px;
            max-width: 900px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 600px) {
            td.col-barcode { display: none; }
            thead th:nth-child(2) { display: none; }

            tr.product-row td { padding: 10px 12px; }
            thead th { padding: 12px; }

            .top-title { font-size: 0.9rem; }
            .back-btn { padding: 8px 12px; }

            td.col-name { font-size: 0.78rem; }
        }
    </style>
</head>

    const totalProducts = DATA.filter(r => r.type === 'product').length;

    function isCategoryMainLevel(name) {
        return name.startsWith('ПРОДУКЦИЯ') || (!name.includes('"') && name === name.toUpperCase() && name.length > 3);
    }

    function renderTable(filtered) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let visibleProducts = 0;

        // When filtering, skip category rows and just show products
        const isFiltering = document.getElementById('searchInput').value.trim().length > 0;

        if (isFiltering) {
            filtered.forEach(row => {
                if (row.type !== 'product') return;
                visibleProducts++;
                const tr = document.createElement('tr');
                tr.className = 'product-row';
                tr.innerHTML = `
                    <td class="col-name">${row.name}</td>
                    <td class="col-barcode">${row.barcode || '—'}</td>
                    <td class="col-qty">${row.qty || '—'}</td>
                    <td class="col-price"><span class="price-val">${row.price ? row.price + ' сум' : '—'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            DATA.forEach(row => {
                if (row.type === 'category') {
                    const tr = document.createElement('tr');
                    const isMain = isCategoryMainLevel(row.name);
                    tr.className = isMain ? 'cat-main' : 'cat-sub';
                    tr.innerHTML = `<td colspan="4">${row.name}</td>`;
                    tbody.appendChild(tr);
                } else {
                    visibleProducts++;
                    const tr = document.createElement('tr');
                    tr.className = 'product-row';
                    tr.innerHTML = `
                        <td class="col-name">${row.name}</td>
                        <td class="col-barcode">${row.barcode || '—'}</td>
                        <td class="col-qty">${row.qty || '—'}</td>
                        <td class="col-price"><span class="price-val">${row.price ? row.price + ' сум' : '—'}</span></td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        }

        document.getElementById('noResults').style.display = visibleProducts === 0 ? 'block' : 'none';
        document.getElementById('priceTable').style.display = visibleProducts === 0 ? 'none' : '';
        document.getElementById('statsBar').textContent = isFiltering
            ? `Найдено: ${visibleProducts} из ${totalProducts} позиций`
            : `Всего позиций: ${totalProducts}`;
    }

    function filterTable() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!q) { renderTable(DATA); return; }
        const filtered = DATA.filter(r =>
            r.type === 'product' &&
            (r.name.toLowerCase().includes(q) || r.barcode.includes(q))
        );
        renderTable(filtered);
    }

    renderTable(DATA);
    </script>
