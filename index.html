<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Холкина Екатерина | Контакты</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdfbfb;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-hover: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #f472b6;
            --accent-glow: rgba(244, 114, 182, 0.3);
            --border-radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: float 15s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(251, 194, 235, 0.5);
            top: -5%;
            left: -10%;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: rgba(166, 193, 238, 0.4);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
            animation-duration: 20s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.05); }
        }

        /* Кнопка переключения языка */
        .lang-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 8px 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-toggle:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.18);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .lang-toggle:active {
            transform: scale(0.95);
        }

        .lang-flag {
            font-size: 1rem;
        }

        .profile-container {
            text-align: center;
            margin-bottom: 32px;
            z-index: 1;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 16px;
            object-fit: cover;
            box-shadow: 0 10px 25px var(--accent-glow);
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #334155;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .content-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            z-index: 1;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            text-decoration: none;
            color: var(--text-primary);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 16px 22px;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
        }

        .btn:hover {
            background: var(--glass-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(244, 114, 182, 0.15);
            border-color: #fff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .icon-box {
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
        }

        h2.section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: -16px;
            padding-left: 8px;
            font-weight: 600;
        }

        .payment-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .compact-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .compact-card:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 114, 182, 0.15);
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .card-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-primary);
        }

        .copy-btn-compact {
            background: #fff;
            color: var(--text-primary);
            border: 1px solid #e2e8f0;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .copy-btn-compact:hover {
            background: #fdf2f8;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .copy-btn-compact:active {
            transform: scale(0.92);
        }

        .color-tg { color: #38bdf8; }
        .color-phone { color: #10b981; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: var(--accent-color);
            border: 1px solid rgba(244, 114, 182, 0.3);
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="bg-animated">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
    </div>

    <!-- Кнопка переключения языка -->
    <button class="lang-toggle" id="langBtn" onclick="toggleLang()">UZB</button>

    <div class="profile-container">
        <img src="logo.jpg" alt="Холкина Екатерина" class="profile-img">
        <h1>Холкина Екатерина</h1>
        <p id="job-title">Торговый представитель<br>Rado max trade &amp; Merak trade</p>
    </div>

    <div class="content-container">
        <div class="links-group">
            <a href="tel:+998992304213" class="btn">
                <span class="icon-box color-phone"><i class="fa-solid fa-phone"></i></span>
                <span data-i18n="call">Позвонить мне</span>
            </a>

            <a href="https://t.me/Kottofeechka" class="btn" target="_blank" rel="noopener noreferrer">
                <span class="icon-box color-tg"><i class="fa-brands fa-telegram"></i></span> Telegram
            </a>
        </div>

        <h2 class="section-title" data-i18n="inn-section">Реквизиты ИНН</h2>

        <div class="payment-cards">
            <div class="compact-card">
                <div class="card-details">
                    <span class="card-title" data-i18n="inn-rado-label">ИНН Rado max trade</span>
                    <span class="card-number" id="inn-rado">302037821</span>
                </div>
                <button class="copy-btn-compact" onclick="copyText('inn-rado', this)" data-i18n="copy">Copy</button>
            </div>

            <div class="compact-card">
                <div class="card-details">
                    <span class="card-title" data-i18n="inn-merak-label">ИНН Merak trade</span>
                    <span class="card-number" id="inn-merak">311822165</span>
                </div>
                <button class="copy-btn-compact" onclick="copyText('inn-merak', this)" data-i18n="copy">Copy</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        /* ───── Переводы ───── */
        const i18n = {
            ru: {
                'call':           'Позвонить мне',
                'inn-section':    'Реквизиты ИНН',
                'inn-rado-label': 'ИНН Rado max trade',
                'inn-merak-label':'ИНН Merak trade',
                'copy':           'Copy',
                'copied':         'ИНН скопирован!',
                'job-title':      'Торговый представитель<br>Rado max trade &amp; Merak trade',
                'page-title':     'Холкина Екатерина | Контакты'
            },
            uz: {
                'call':           'Menga qo\'ng\'iroq qiling',
                'inn-section':    'INN rekvizitlari',
                'inn-rado-label': 'INN Rado max trade',
                'inn-merak-label':'INN Merak trade',
                'copy':           'Nusxa',
                'copied':         'INN nusxalandi!',
                'job-title':      'Savdo vakili<br>Rado max trade &amp; Merak trade',
                'page-title':     'Xolkina Yekaterina | Kontaktlar'
            }
        };

        let currentLang = 'ru';

        function applyLang(lang) {
            const t = i18n[lang];
            /* Все обычные элементы */
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            /* Должность (содержит HTML) */
            document.getElementById('job-title').innerHTML = t['job-title'];
            /* Заголовок вкладки */
            document.title = t['page-title'];
            /* Кнопка языка */
            document.getElementById('langBtn').textContent = lang === 'ru' ? 'UZB' : 'RU';
        }

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'uz' : 'ru';
            applyLang(currentLang);
        }

        /* ───── Копирование ───── */
        function copyText(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText.replace(/\s+/g, '');
            const t = i18n[currentLang];

            const copyToClipboardFallback = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); } catch (err) {}
                document.body.removeChild(textArea);
            };

            const handleSuccess = () => {
                const originalText = btnElement.innerText;
                btnElement.innerText = '✓';
                btnElement.style.background = '#fdf2f8';
                btnElement.style.color = '#f472b6';
                btnElement.style.borderColor = '#f472b6';

                const toast = document.getElementById('toast');
                toast.innerText = t['copied'];
                toast.classList.add('show');

                setTimeout(() => {
                    btnElement.innerText = t['copy'];
                    btnElement.style.background = '';
                    btnElement.style.color = '';
                    btnElement.style.borderColor = '';
                    toast.classList.remove('show');
                }, 2000);
            };

            if (navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy)
                    .then(handleSuccess)
                    .catch(() => { copyToClipboardFallback(textToCopy); handleSuccess(); });
            } else {
                copyToClipboardFallback(textToCopy);
                handleSuccess();
            }
        }

        /* Инициализация */
        applyLang('ru');
    </script>
</body>

</html>
